[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.watch]
paths = [
  "client/src/**",
  "server/src/**",
  "server/prisma/**",
  "client/package.json",
  "server/package.json",
  "Dockerfile",
  "railway.toml"
]